<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2514" viewBox="0 0 1400 2514">
<rect width="1400" height="100%" fill="#f7f9fc"/>
<style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.sub{font-size:14px;fill:#667085}.h2{font-size:22px;font-weight:700;fill:#1d4ed8}.h3{font-size:18px;font-weight:700;fill:#172033}.p{font-size:15px}.bullet{font-size:15px}.table{font-family:'DejaVu Sans Mono',monospace;font-size:13px}</style>
<text x="60" y="64" class="title">Изоляция</text>
<text x="60" y="92" class="sub">Source: docs/ISOLATION.md · v0.9.9 · 22.10.2026</text>
<text x="60" y="144" class="h2">Изоляция проектов и агентов</text>
<text x="60" y="168" class="p">Версия 0.9.9 · 22.10.2026</text>
<text x="60" y="192" class="p">Один хост — несколько проектов — несколько агентов. Root —</text>
<text x="60" y="216" class="p">единственный,</text>
<text x="60" y="240" class="p">у кого полные права. Агент проекта получает только git-push в review.</text>
<text x="60" y="276" class="h2">Модель</text>
<text x="60" y="300" class="bullet">• Каждый проект — отдельный пользователь proj-*, каталог /srv/proj-*,</text>
<text x="60" y="324" class="p">bare-репозиторий /srv/proj-*/repo.git.</text>
<text x="60" y="348" class="bullet">• Агент ходит по SSH с ключом, у которого forced command:</text>
<text x="60" y="372" class="p">git-receive-pack &#39;/srv/proj-*/repo.git&#39;, без pty, forwarding и X11.</text>
<text x="60" y="396" class="bullet">• Хуки лежат в /etc/git-hooks/&lt;proj&gt; (root:root, 0755), не в репозитории.</text>
<text x="60" y="420" class="bullet">• Агент пушит только в refs/heads/review. В main двигает только root</text>
<text x="60" y="444" class="p">через git update-ref — это акт одобрения.</text>
<text x="60" y="468" class="bullet">• После зелёного review root делает merge в main и перезапускает</text>
<text x="60" y="492" class="p">proj@&lt;proj&gt;.service. У агента нет sudo и нет shell.</text>
<text x="60" y="528" class="h2">Матрица прав</text>
<text x="60" y="552" class="table">Действие Агент проекта Root</text>
<text x="60" y="576" class="table">Читать свой код да да</text>
<text x="60" y="600" class="table">Читать чужой проект нет да</text>
<text x="60" y="624" class="table">Писать в свой каталог да да</text>
<text x="60" y="648" class="table">Писать в /etc, юниты, хуки нет да</text>
<text x="60" y="672" class="table">Пушить в review да да</text>
<text x="60" y="696" class="table">Пушить в main нет да</text>
<text x="60" y="720" class="table">Деплоить и перезапускать нет да</text>
<text x="60" y="744" class="table">Секреты своего проекта да да</text>
<text x="60" y="768" class="table">Секреты чужого проекта нет да</text>
<text x="60" y="792" class="table">Порты наружу нет да</text>
<text x="60" y="828" class="h2">Схема</text>
<text x="60" y="864" class="h2">Раскладка</text>
<text x="60" y="900" class="h2">Ключ агента</text>
<text x="60" y="924" class="p">authorized_keys — 0600 proj-a:proj-a. Ключ не даёт shell, scp, rsync,</text>
<text x="60" y="948" class="p">port forwarding или запуск произвольной команды.</text>
<text x="60" y="984" class="h2">Юнит</text>
<text x="60" y="1008" class="p">deploy/systemd/proj@.service — шаблон. Экземпляр proj@proj-a:</text>
<text x="60" y="1032" class="p">ReadWritePaths=/srv/%i; секреты — EnvironmentFile=-/etc/%i/app.env.</text>
<text x="60" y="1068" class="h2">Онбординг</text>
<text x="60" y="1092" class="p">Пока refs/heads/main нет, pre-receive отклоняет любой review:</text>
<text x="60" y="1116" class="p">доверенный verify.py берётся именно из main.</text>
<text x="60" y="1152" class="h2">Доверенный gate</text>
<text x="60" y="1176" class="p">pre-receive не запускает verify.py из пушимого дерева. Он берёт</text>
<text x="60" y="1200" class="p">verify.py из refs/heads/main и запускает его на pushed tree. Изменения</text>
<text x="60" y="1224" class="p">verify.py, project.json, tests/, cmd/schemes и cmd/deadcode</text>
<text x="60" y="1248" class="p">отклоняются до запуска. Так агент не может ослабить проверку</text>
<text x="60" y="1272" class="p">тем же пушем.</text>
<text x="60" y="1308" class="h2">PATH и Go</text>
<text x="60" y="1332" class="p">sshd не добавляет /usr/local/go/bin в PATH. Хук явно выставляет:</text>
<text x="60" y="1356" class="p">Без этого go test, gofmt, deadcode уходили бы в skip.</text>
<text x="60" y="1392" class="h2">Пользователь без shell</text>
<text x="60" y="1416" class="p">useradd --shell &#34;$(command -v nologin)&#34;; существующему пользователю</text>
<text x="60" y="1440" class="p">usermod --shell .... git-receive-pack вызывается sshd напрямую и shell</text>
<text x="60" y="1464" class="p">не требует. Проверка: getent passwd proj-a → nologin; ssh ... id не</text>
<text x="60" y="1488" class="p">выполняет id.</text>
<text x="60" y="1524" class="h2">Журнал приёмки</text>
<text x="60" y="1548" class="p">/var/log/git/&lt;proj&gt;.log — root:&lt;proj&gt;, 0640; hook пишет строку на каждый</text>
<text x="60" y="1572" class="p">push: дата, ref, old, new, результат, причина. Запись идёт через ACL</text>
<text x="60" y="1596" class="p">(setfacl -m u:&lt;proj&gt;:rw-), иначе bootstrap падает в 0660 и предупреждает.</text>
<text x="60" y="1620" class="p">Ротация — /etc/logrotate.d/proj-&lt;proj&gt;: size 100k, rotate 5,</text>
<text x="60" y="1644" class="p">copytruncate; ACL сохраняется.</text>
<text x="60" y="1680" class="h2">Один проект</text>
<text x="60" y="1704" class="p">selftest-isolation.sh работает и с одним проектом:</text>
<text x="60" y="1728" class="p">Проверяет: свой CANARY читается, sudo нет, портов нет, hooks/unit/log</text>
<text x="60" y="1752" class="p">на месте. С двумя — плюс «чужой CANARY не читается».</text>
<text x="60" y="1788" class="h2">systemd</text>
<text x="60" y="1812" class="p">ExecStart=/srv/%i/run — стек-нейтральный launcher. systemd-analyze verify</text>
<text x="60" y="1836" class="p">на шаблоне без run ожидаемо краснеет; проверять юнит нужно на</text>
<text x="60" y="1860" class="p">живом</text>
<text x="60" y="1884" class="p">экземпляре. run должен быть исполняемым и запускать</text>
<text x="60" y="1908" class="p">приложение проекта.</text>
<text x="60" y="1944" class="h2">Предупреждение про /srv</text>
<text x="60" y="1968" class="p">bootstrap-project.sh ставит /srv в 0711. Это влияет на весь хост,</text>
<text x="60" y="1992" class="p">не только на новый проект. Если на /srv есть другие данные —</text>
<text x="60" y="2016" class="p">проверь</text>
<text x="60" y="2040" class="p">владельца и режим до онбординга.</text>
<text x="60" y="2076" class="h2">Проверки</text>
<text x="60" y="2100" class="bullet">• python verify.py — green.</text>
<text x="60" y="2124" class="bullet">• python verify.py --close-task — green.</text>
<text x="60" y="2148" class="bullet">• sudo deploy/selftest-isolation.sh proj-a proj-b:</text>
<text x="60" y="2172" class="bullet">• proj-a не читает CANARY проекта B;</text>
<text x="60" y="2196" class="bullet">• proj-a не имеет sudo;</text>
<text x="60" y="2220" class="bullet">• нет слушающих сокетов;</text>
<text x="60" y="2244" class="bullet">• hooksPath и права root:root;</text>
<text x="60" y="2268" class="bullet">• unit и log на месте.</text>
<text x="60" y="2292" class="bullet">• Живой push:</text>
<text x="60" y="2316" class="bullet">• git push origin HEAD:main → rejected;</text>
<text x="60" y="2340" class="bullet">• git push origin HEAD:review → accepted после trusted verify;</text>
<text x="60" y="2364" class="bullet">• подмена verify.py в review → rejected;</text>
<text x="60" y="2388" class="bullet">• удаление/force push → rejected.</text>
<text x="60" y="2424" class="h2">Границы</text>
<text x="60" y="2448" class="bullet">• Это Linux/systemd/sshd-модель; на Windows live-проверка невозможна.</text>
<text x="60" y="2472" class="bullet">• Caddy — единственный вход; порты приложений наружу не</text>
<text x="60" y="2496" class="p">публикуются.</text>
<text x="60" y="2520" class="bullet">• Секреты своего проекта доступны агенту только через</text>
<text x="60" y="2544" class="p">запущенный процесс</text>
<text x="60" y="2568" class="p">или явно выданный env; в репозитории секретов нет.</text>
<text x="60" y="2592" class="bullet">• Нового правила нет: политика живёт в PROJECT.md, этом файле и</text>
<text x="60" y="2616" class="p">PROCESS.md.</text>
</svg>
