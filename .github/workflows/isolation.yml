name: isolation

on:
  push:
  pull_request:

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: isolation acceptance
        run: sudo --preserve-env=PATH bash deploy/ci/isolation.sh
      - name: cleanup
        if: always()
        run: sudo bash deploy/ci/isolation-cleanup.sh proj-a proj-b
