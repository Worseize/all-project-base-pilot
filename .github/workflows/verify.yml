name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: red gate
        run: python verify.py
      - name: gate tests
        run: python -m unittest discover -s tests -v
      - name: example microblock
        working-directory: examples/minimal-go
        run: go test ./...
