name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: scheme drift
        run: |
          python -m pip install --disable-pip-version-check pillow
          python verify.py --update-schemes
          git diff --exit-code -- docs/schemes.lock.json
      - name: red gate
        run: python verify.py
      - name: close task debt
        run: python verify.py --close-task
      - name: gate tests
        run: python -m unittest discover -s tests -v
      - name: example microblock
        working-directory: examples/minimal-go
        run: go test ./...
